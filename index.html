<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📔 日記ダッシュボード</h1>
            <p class="subtitle">あなたの日々を記録しましょう</p>
        </header>

        <main>
            <section class="add-entry">
                <h2>新しい日記を追加</h2>
                <form id="diaryForm">
                    <div class="form-group">
                        <label for="entryTitle">タイトル</label>
                        <input type="text" id="entryTitle" placeholder="今日のタイトル..." required>
                    </div>
                    <div class="form-group">
                        <label for="entryContent">内容</label>
                        <textarea id="entryContent" placeholder="今日の出来事を書きましょう..." rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">追加する</button>
                </form>
            </section>

            <section class="entries-section">
                <div class="section-header">
                    <h2>日記一覧</h2>
                    <span class="entry-count">0件の日記</span>
                </div>
                <div id="entriesList" class="entries-list">
                    <p class="empty-message">まだ日記がありません。最初の日記を書いてみましょう！</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 日記アプリケーション</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
